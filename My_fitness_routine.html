<!DOCTYPE html>
<html>

<head>
    <title>My Fitness Routine Cards</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .card {
            background-color: white;
            width: 250px;
            padding: 20px;
            border: 3px solid darkblue;
            margin: 15px;
            float: left;
            text-align: center;
            box-shadow: 3px 3px 8px gray;
        }

        .card h2 {
            color: darkblue;
        }

        .card p {
            color: #444;
        }

        .clear {
            clear: both;
        }
    </style>
</head>

<body>

    <h1>My Fitness Routine</h1>

    <div class="card">
        <h2>Push-ups</h2>
        <p>3 sets of 10 repetitions</p>
        <p>Strengthens the chest and arms.</p>
    </div>

    <div class="card">
        <h2>Squats</h2>
        <p>3 sets of 15 repetitions</p>
        <p>Helps strengthen the legs.</p>
    </div>

    <div class="card">
        <h2>Plank</h2>
        <p>3 sets of 30 seconds</p>
        <p>Improves core strength.</p>
    </div>

    <div class="card">
        <h2>Jumping Jacks</h2>
        <p>3 sets of 20 repetitions</p>
        <p>Good for warming up.</p>
    </div>

    <div class="clear"></div>

</body>

</html>
