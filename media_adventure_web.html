<!DOCTYPE html>
<html>

<head>
    <title>My Media Adventure</title>
    <style>
        body {
            font-family: Arial;
            background-color: #eef7ff;
            margin: 0;
        }

        header {
            background-color: #2874a6;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 800px;
            margin: auto;
            padding: 25px;
        }

        section {
            background-color: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 10px;
        }

        img {
            width: 300px;
            display: block;
            margin: auto;
        }

        audio {
            width: 100%;
        }

        video {
            width: 100%;
        }

        iframe {
            width: 100%;
            height: 300px;
            border: none;
        }

        h2 {
            color: #2874a6;
        }
    </style>
</head>

<body>

    <header>
        <h1>🌍 My Media Adventure</h1>
        <p>Images, Audio, Video and More!</p>
    </header>

    <div class="container">

        <section>
            <h2>My Adventure</h2>
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee" alt="Adventure">
        </section>

        <section>
            <h2>My Audio</h2>
            <audio controls>
                <source src="audio.mp3" type="audio/mpeg">
            </audio>
        </section>

        <section>
            <h2>My Video</h2>
            <video controls>
                <source src="video.mp4" type="video/mp4">
            </video>
        </section>

        <section>
            <h2>My Favourite Website</h2>
            <iframe src="https://www.wikipedia.org"></iframe>
        </section>

    </div>

</body>

</html>
