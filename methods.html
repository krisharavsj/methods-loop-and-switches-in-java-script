<html>
    <head>
        <title>Methods in JS</title>
    </head>
    <body>
        <h2>JavaScript String Methods</h2>
        <p>Basic methods</p>
        <script>
            var str="AmAzIng"
            document.write(str.toUpperCase());
            document.write("<br>");
            document.write(str.toLowerCase());
            document.write("<br>");
            document.write(str.startsWith('i'));
            document.write("<br>");
            var str1="I learnt about methods"
            var p= new RegExp("about")
            var res= p.test(str1)
            document.write(res)
        </script>

    </body>
</html>
