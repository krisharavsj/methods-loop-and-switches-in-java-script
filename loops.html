<html>
    <head>
        <title>Loops in JS</title>
    </head>
    <body>
        <h2>Loops for JavaScript</h2>
        <p id="demo"></p>
        <script>
            var fruits=["Guava", "Apple", "Mango", "Lychee", "Tomato"];
            var text="";
            for(i=0;i<fruits.length;i++)
        {text+=fruits[i]+"<br>";}
        document.getElementById("demo").innerHTML=text;

        </script>
    </body>
</html>
